name: validate

# The website was rolled back to its 2026-11-06 version (commit 6c94c4d). The signal-site checks
# (seven-tab guard, signal tests, seeded sample build, intelligence determinism) and the weekly
# data refresh tested pages and data that site no longer has; they live in git history before the
# rollback commit if the signal pages come back.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Python tests
        working-directory: analysis
        # test_locations / test_signal_scores check signal-site outputs the rolled-back site does not ship.
        run: |
          pip install -r requirements.txt
          python -m pytest -q --ignore=tests/test_locations.py --ignore=test_signal_scores.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web lint and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
