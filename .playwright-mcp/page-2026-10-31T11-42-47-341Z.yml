          - paragraph [ref=f16e263]: Every extreme is one number per year, so it is tested only for the whole year (the manifest lists a single season for these measures). Percentiles are computed per grid square across the daily record, so “heavy” means heavy for that square, not for the region.
      - generic [ref=f16e264]:
        - heading "5. Regions and area weighting" [level=2] [ref=f16e265]
        - generic [ref=f16e266]:
          - paragraph [ref=f16e267]:
            - text: Regions (
            - code [ref=f16e268]: analysis/zones.json
            - text: ) are approximate rectangles around hazard-prone landscapes, drawn by geography (basins, mountain belts, forest belts), not by national borders. “All of South Asia” is the full study box (5–38°N, 60–100°E).
          - paragraph [ref=f16e269]: "A region's series is the weighted average of its grid squares:"
          - generic [ref=f16e270]:
            - paragraph [ref=f16e271]:
              - text: w
              - subscript [ref=f16e272]: ij
              - text: = f
              - subscript [ref=f16e273]: ij
              - text: · land
              - subscript [ref=f16e274]: ij
              - text: · cos φ
              - subscript [ref=f16e275]: i
            - paragraph [ref=f16e276]: where f is the share of the square inside the region box, land the share of the square that is land (from a fine MERRA-2 mask, with a square counted if land ≥ 25%), and cos φ the cosine of its latitude, so the area a square represents on the globe is respected. Squares that are mostly sea are excluded.
          - paragraph [ref=f16e277]: The region's trend is then tested on that series exactly as a square's. Region boxes are not exact watersheds or forest boundaries, and neighbouring boxes can cover one square; regional numbers are contextual, not administrative statistics.
