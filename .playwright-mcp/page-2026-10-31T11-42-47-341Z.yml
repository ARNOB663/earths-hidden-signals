          - generic [ref=f16e204]:
            - generic [ref=f16e205]: A dataset we rejected
            - paragraph [ref=f16e206]: We first used NASA POWER (MERRA-2) rainfall. When we plotted it, rainfall over the Bengal delta jumped from about 1,200 mm to about 1,800 mm a year in 1997, and to over 3,000 mm after 2015. Real rain does not do that; the jumps come from changes in the observations fed into the model, and its soil moisture inherits them. Trends from it would have been confidently wrong, so we switched to GISTEMP and GPCP, which are built to stay consistent over decades. We now always plot a series before trusting its trend. The soil water on the satellite map is SMAP, a direct measurement since 2015; MERRA-2 soil moisture is not used for any trend.
      - generic [ref=f16e207]:
        - heading "2. How much is it changing?" [level=2] [ref=f16e208]
        - generic [ref=f16e209]:
          - paragraph [ref=f16e210]:
            - text: The rate of change is
            - strong [ref=f16e211]: Sen's slope
            - text: "(Sen 1968): the median of the slopes between every pair of years in the record. Unlike an ordinary least-squares fit, a single extreme year cannot drag it, so one very hot or very wet year does not invent a trend. We report it per decade."
          - generic [ref=f16e212]:
            - generic [ref=f16e213]: Sen's slope for a series y₁ … yₙ
            - paragraph [ref=f16e214]: "b = median { (yⱼ − yᵢ) / (j − i) : i &lt; j }"
            - paragraph [ref=f16e215]: "Uncertainty: the 95% confidence interval from the rank-based formula of Gilbert (1987), using the variance of the Mann–Kendall statistic. It is shown as “+0.31 °C per decade (+0.27 to +0.36)”."
          - paragraph [ref=f16e216]: A slope is only meaningful next to its starting level. Temperature is published as an anomaly relative to the 1951–1980 mean, the conventional GISTEMP baseline, so 0 °C means “the late-20th-century average”. Rainfall is an absolute seasonal total in millimetres, and we also report the slope as a percentage of the usual amount where that is meaningful.
      - generic [ref=f16e217]:
        - heading "3. Is it significant?" [level=2] [ref=f16e218]
        - generic [ref=f16e219]:
          - paragraph [ref=f16e220]:
            - text: The
            - strong [ref=f16e221]: Mann–Kendall test
            - text: "(Mann 1945; Kendall 1975) is non-parametric: it asks, if there were no trend, how likely it is that this many years are higher than earlier years. It makes no assumption of normality, which suits short, skewed climate series. The result is a two-sided p-value; p < 0.05 means chance is an unlikely explanation."
          - paragraph [ref=f16e222]:
            - text: "Climate years are not independent: a warm year often follows another. That autocorrelation makes the plain test report too many false trends, so we use the"
            - strong [ref=f16e223]: Hamed–Rao correction
            - text: (Hamed & Rao 1998), which inflates the variance of the test statistic by the effective sample size. When the correction is invalid for a series (a negative correction factor), we fall back to the unmodified test and report that p-value.
          - paragraph [ref=f16e224]:
            - text: A map tests hundreds of squares at once, so about 5% would look significant by luck. We control the
            - strong [ref=f16e225]: false discovery rate
            - text: with the Benjamini–Hochberg procedure (α
            - subscript [ref=f16e226]: FDR
            - text: = 0.10, following Wilks 2016), which keeps the expected share of false discoveries near 5% in spatially correlated fields. A square is drawn solid and labelled “clear change” only if it passes this map-wide test.
          - generic [ref=f16e227]:
            - generic [ref=f16e228]: When a result is not significant
            - paragraph [ref=f16e229]:
              - text: "We say so plainly: “No statistically detectable trend.” This means the year-to-year variability is too large, over this record, to separate a real trend from natural variability. It does"
              - emphasis [ref=f16e230]: not
              - text: "prove nothing is changing: a longer record, a larger area or a different measure might reveal it. Absence of evidence is not evidence of absence."
      - generic [ref=f16e231]:
        - heading "4. Seasons and extremes" [level=2] [ref=f16e232]
        - generic [ref=f16e233]:
          - paragraph [ref=f16e234]: "For temperature and rainfall we test three Gregorian aggregations of the same monthly record: the whole year, the pre-monsoon (March–May) and the monsoon (June–September). Temperature uses the seasonal mean and rainfall the seasonal total (each month scaled by its number of days). The monsoon seasons exist because the site's hazard regions are South Asian; they are not described as global seasons."
          - table [ref=f16e236]:
            - rowgroup [ref=f16e241]:
              - row [ref=f16e242]:
                - columnheader "Measure" [ref=f16e243]
                - columnheader "Definition" [ref=f16e244]
                - columnheader "Record" [ref=f16e245]
            - rowgroup [ref=f16e246]:
