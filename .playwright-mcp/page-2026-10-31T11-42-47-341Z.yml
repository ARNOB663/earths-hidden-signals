      - generic [ref=f16e70]:
        - heading "Summary of method" [level=2] [ref=f16e71]
        - list [ref=f16e73]:
          - listitem [ref=f16e74]:
            - generic [ref=f16e75]: "1"
            - paragraph [ref=f16e76]:
              - strong [ref=f16e77]: Change is measured on each map square.
              - text: Every land square of the 2° (temperature) or 2.5° (rainfall) grid, 1981–2025. The rate of change is Sen's slope in units per decade; whether the change could be chance is a Hamed–Rao modified Mann–Kendall test, and a map-wide Benjamini–Hochberg false-discovery check decides which squares are drawn clearly.
          - listitem [ref=f16e78]:
            - generic [ref=f16e79]: "2"
            - paragraph [ref=f16e80]:
              - strong [ref=f16e81]: Seasons and extremes use the same test.
              - text: Temperature and rainfall are aggregated to the whole year and to two seasons (Mar–May, Jun–Sep). Four extreme measures from the same records are tested in the same way.
          - listitem [ref=f16e82]:
            - generic [ref=f16e83]: "3"
            - paragraph [ref=f16e84]:
              - strong [ref=f16e85]: Regions are area-weighted.
              - text: A region's series is the average of its land squares, weighted by area inside the region, land fraction and cos(latitude), so high-latitude squares do not count double.
          - listitem [ref=f16e86]:
            - generic [ref=f16e87]: "4"
            - paragraph [ref=f16e88]:
              - strong [ref=f16e89]: Hazards are linked, then compared with the past.
              - text: Past disaster events are counted per region per year and correlated with the relevant seasonal driver after removing long-term trends. Where the link is statistically significant and in the expected direction, this year's conditions are compared with those of past high-event years. This is a preparedness comparison, not a forecast.
          - listitem [ref=f16e90]:
            - generic [ref=f16e91]: "5"
            - paragraph [ref=f16e92]:
              - strong [ref=f16e93]: A second record must agree.
              - text: The headline temperature and rainfall trends are repeated with CRU TS 4.10, an independent station-based record. Agreement raises confidence; disagreement is reported.
