      - generic [ref=f16e579]:
        - heading "9. Limitations" [level=2] [ref=f16e580]
        - list [ref=f16e582]:
          - listitem [ref=f16e583]:
            - strong [ref=f16e584]: Resolution.
            - text: Grids are 1°–2.5° (about 110–280 km), so local extremes, valleys and cities are smoothed out. A map square is not a measurement of one place.
          - listitem [ref=f16e585]:
            - strong [ref=f16e586]: Record length.
            - text: 45 years is enough for a temperature trend and marginal for rainfall; the landslide record covers only 11 years, too short for an event-count trend.
          - listitem [ref=f16e587]:
            - strong [ref=f16e588]: Incomplete events.
            - text: News-based landslide reports miss remote areas, satellites miss fires under cloud and smoke, and GDACS coverage improved over time. Where these changes are gradual they can mimic trends.
          - listitem [ref=f16e589]:
            - strong [ref=f16e590]: Multiple testing.
            - text: FDR control limits but does not eliminate false discoveries; a single isolated “clear change” square should be treated cautiously.
          - listitem [ref=f16e591]:
            - strong [ref=f16e592]: Correlation is not causation.
            - text: Land use, deforestation, road building, water management and human ignition also drive these hazards and are not in our models.
          - listitem [ref=f16e593]:
            - strong [ref=f16e594]: Regions.
            - text: Hazard regions are rectangles drawn by geography, not administrative units or exact watersheds.
          - listitem [ref=f16e595]:
            - strong [ref=f16e596]: No forecast.
            - text: The preparedness signal compares the present with the past; it is not a prediction of events.
