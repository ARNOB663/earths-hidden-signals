          - link "How far the signal can be checked" [ref=e91] [cursor=pointer]:
            - /url: /accuracy
      - generic [ref=e92]:
        - generic [ref=e93]: "Geography: geoBoundaries gbOpen, current release (as served by the geoBoundaries API) · Coverage: A grid cell belongs to the area whose geoBoundaries boundary contains the cell centre. A variable is covered when at least 50% of the variable's cells in the area's bounding box belong to the area and carry a usable series. The NASA analysis grids used here cover South Asia only, so countries outside their extent have no measured coverage and show 'No data'. Coverage is also measured only for ADM0 countries and ADM1 areas; ADM2 polygons are usually smaller than these grids. No weather value is invented for an area that lacks one."
