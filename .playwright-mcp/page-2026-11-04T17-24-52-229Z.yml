      - generic [ref=e40]:
        - paragraph [ref=e41]: The monitoring gap
        - heading "Satellites cover the planet. Decisions happen in districts." [level=1] [ref=e42]
        - paragraph [ref=e43]: "Most maps show where water goes. This one starts a step earlier: where can Earth observation actually support a decision — and where is nobody watching? Every number below is computed from the files this site ships, not quoted."
      - region [ref=e44]:
        - heading "From listed to decision-ready" [level=2] [ref=e45]
        - list [ref=e46]:
          - listitem [ref=e47]:
            - generic [ref=e48]:
              - generic [ref=e49]: Listed
