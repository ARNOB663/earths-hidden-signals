            - paragraph [ref=e51]: "231"
            - paragraph [ref=e52]: countries
            - paragraph [ref=e53]: "Every country and territory geoBoundaries publishes boundaries for. This is geography, not measurement: a name and a line on a map."
          - listitem [ref=e54]:
            - generic [ref=e55]:
              - generic [ref=e56]: Measured
              - generic [ref=e57]: 2/3
            - paragraph [ref=e58]: "6"
            - paragraph [ref=e59]: countries
            - paragraph [ref=e60]: Countries whose boundaries overlap the NASA analysis grids (60–100°E, 5–38°N). Here we have a satellite record to compare against.
          - listitem [ref=e61]:
            - generic [ref=e62]:
              - generic [ref=e63]: Decision-ready
              - generic [ref=e64]: 3/3
            - paragraph [ref=e65]: "422"
            - paragraph [ref=e66]: areas
            - paragraph [ref=e67]: "Administrative areas with a place record: today's rain against its own history, and a Trust label saying whether that history can be checked at all."
        - paragraph [ref=e68]: That is 2.6% of listed countries measured, and 13% of listed first-level areas reaching a decision-ready record. The fall from 231 countries listed to 422 areas we can actually stand behind is not a failure of the data — it is the finding.
      - region [ref=e69]:
        - heading "Inside the covered area, most places still cannot be checked" [level=2] [ref=e70]
        - paragraph [ref=e71]: Coverage is only the first barrier. The map lists 3,236 first-level and 49,193 second-level administrative areas; 422 of them reach a decision-ready record. And even where we have 45 years of history, a place can be unreadable if no trend in it stands out from year-to-year noise. Trust says which is which.
        - generic [ref=e72]:
          - generic [ref=e73]:
            - term [ref=e74]: Detectable
            - definition [ref=e75]: "171"
            - definition [ref=e76]: A trend here is separated from noise, so a raised signal can be checked against history.
          - generic [ref=e77]:
            - term [ref=e78]: Blind spot
            - definition [ref=e79]: "251"
            - definition [ref=e80]: We have the rain, but no trend here can yet be told apart from noise — so a signal cannot be checked.
          - generic [ref=e81]:
            - term [ref=e82]: No history
            - definition [ref=e83]: "0"
            - definition [ref=e84]: No gridded history covers the area. It shows No data rather than a colour.
        - paragraph [ref=e85]: "Of 422 decision-ready areas, 312 carry a live reading today and 251 (59.5%) are blind spots: we can show the rain, but we cannot yet say it is a change."
      - region [ref=e86]:
        - heading "Why we map the gap instead of the flood" [level=2] [ref=e87]
        - paragraph [ref=e88]: "A flood map that looks confident where it has no data is worse than no map: it spends trust it has not earned. So this project reports the two things it can stand behind — where observation exists, and whether a place can be checked — and leaves the decision to people who know the ground."
        - generic [ref=e89]:
